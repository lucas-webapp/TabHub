<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Même grammaire EXACTEMENT que le logo de la barre du haut (index.html, .logo-marque) : six
       barres — les six cordes d'une tablature — de calibre et d'opacité croissants, du mi aigu au
       mi grave. Une version antérieure de cette icône n'en dessinait que cinq, à une autre marge :
       un favicon qui ne ressemble pas tout à fait à l'app qu'il représente, dès qu'on les voit côte
       à côte (onglet du navigateur vs barre du haut). Fond arrondi + vert plein plutôt que
       currentColor : cette icône, contrairement à celle de la barre du haut, doit rester lisible
       hors de tout contexte CSS — onglet de navigateur, écran d'accueil d'un téléphone. -->
  <rect width="48" height="48" rx="10" fill="#0a0a0a"/>
  <g fill="#00e676">
    <rect x="6" y="7"    width="36" height="3"   rx="1.5" opacity=".2"/>
    <rect x="6" y="13.6" width="36" height="3.2" rx="1.6" opacity=".36"/>
    <rect x="6" y="20.2" width="36" height="3.4" rx="1.7" opacity=".52"/>
    <rect x="6" y="26.8" width="36" height="3.6" rx="1.8" opacity=".68"/>
    <rect x="6" y="33.4" width="36" height="3.8" rx="1.9" opacity=".84"/>
    <rect x="6" y="40"   width="36" height="4"   rx="2"/>
  </g>
</svg>
