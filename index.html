<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- `user-scalable=no` : le zoom du NAVIGATEUR est écarté au profit de celui de l'APPLICATION
         (voir le champ Zoom, barre de transport), qui remet réellement la partition en page au lieu
         d'en agrandir les pixels. Sans cette mention, viser des cases au doigt déclenchait sans cesse
         le zoom par double-tap du téléphone — deux notes tapées vite l'une après l'autre au même
         endroit sont exactement un double-tap. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TabHub — éditeur de tablatures</title>
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="style.css?v=202608280300">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bibliothèques vendues en local plutôt qu'appelées sur un CDN, comme dans HarmoHub : l'appli
         doit pouvoir tourner hors ligne, et une version figée ne peut pas changer sous nos pieds.
         Toutes deux en licence MIT. Elles ne sont pas des modules ES : chargées en <script> classique,
         elles se posent sur `window` (Tone, jspdf), où les modules de src/ vont les chercher. -->
    <script src="vendor/tone.min.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>

<div class="barre-haut">
    <button type="button" id="btn-annuler" class="btn-icone" title="Annuler (Ctrl+Z)" aria-label="Annuler" disabled></button>
    <button type="button" id="btn-retablir" class="btn-icone" title="Rétablir (Ctrl+Y)" aria-label="Rétablir" disabled></button>
    <span class="separateur"></span>
    <button type="button" id="btn-nouveau" class="btn-icone" title="Nouvelle tablature" aria-label="Nouvelle tablature"></button>
    <button type="button" id="btn-ouvrir" class="btn-icone" title="Importer un fichier .json (Ctrl+O)" aria-label="Importer"></button>
    <button type="button" id="btn-exporter" class="btn-icone" title="Exporter en .json (Ctrl+Maj+S)" aria-label="Exporter"></button>
    <button type="button" id="btn-enregistrer" class="btn-icone btn-icone-accent" title="Enregistrer (Ctrl+S)" aria-label="Enregistrer"></button>
    <button type="button" id="btn-pdf" class="btn-icone" title="Exporter en PDF (Ctrl+P)" aria-label="Exporter en PDF"></button>
    <span class="separateur"></span>
    <button type="button" id="btn-midi-ouvrir" class="btn-icone" title="Importer un fichier MIDI (.mid)" aria-label="Importer un fichier MIDI"></button>
    <button type="button" id="btn-midi-exporter" class="btn-icone" title="Exporter en MIDI (.mid)" aria-label="Exporter en MIDI"></button>
    <span class="separateur"></span>
    <button type="button" id="btn-reglages" class="btn-icone" title="Réglages" aria-label="Réglages"></button>
    <button type="button" id="btn-aide" class="btn-icone" title="Raccourcis clavier (?)" aria-label="Raccourcis clavier"></button>

    <span class="pousse"></span>
    <input type="text" id="champ-titre" class="titre-morceau" value="Sans titre" aria-label="Titre du morceau" spellcheck="false">
    <span class="pousse"></span>

    <a class="logo" href="#" onclick="return false" title="TabHub" aria-label="TabHub">
        <span class="logo-marque">
            <!-- Même grammaire que le logo « grille » de HarmoHub (barres arrondies, opacité
                 croissante, currentColor, 48×48) mais tournée d'un quart de tour et à six barres :
                 les six cordes d'une tablature plutôt que quatre repères génériques. Le calibre
                 croît légèrement lui aussi, du mi aigu au mi grave, comme un vrai jeu de cordes. -->
            <svg viewBox="0 0 48 48" aria-hidden="true">
                <rect x="6" y="7"    width="36" height="3"   rx="1.5" fill="currentColor" opacity=".2"/>
                <rect x="6" y="13.6" width="36" height="3.2" rx="1.6" fill="currentColor" opacity=".36"/>
                <rect x="6" y="20.2" width="36" height="3.4" rx="1.7" fill="currentColor" opacity=".52"/>
                <rect x="6" y="26.8" width="36" height="3.6" rx="1.8" fill="currentColor" opacity=".68"/>
                <rect x="6" y="33.4" width="36" height="3.8" rx="1.9" fill="currentColor" opacity=".84"/>
                <rect x="6" y="40"   width="36" height="4"   rx="2"   fill="currentColor"/>
            </svg>
        </span>
        <span class="logo-texte">TabHub</span>
    </a>
</div>

<!-- La palette est construite par ui/toolbar.js : ses boutons dérivent des mêmes tables que les
     raccourcis clavier (durées, effets), pour que les deux ne puissent pas se contredire. -->
<div class="barre-outils" id="barre-outils" role="toolbar" aria-label="Outils d'édition"></div>

<div class="zone-partition" id="zone-partition" tabindex="0" role="application"
     aria-label="Partition — flèches pour se déplacer, chiffres pour saisir une case">
    <div class="feuille" id="feuille"></div>
</div>

<!-- Pavé de saisie tactile — construit par src/ui/pave.js, replié tant qu'on n'en a pas besoin.
     Il occupe SA PROPRE rangée de la grille (voir style.css) plutôt que de flotter par-dessus la
     partition : un clavier qui recouvre ce qu'on écrit est précisément le défaut qu'il corrige. -->
<div class="pave-tactile" id="pave-tactile" role="group" aria-label="Pavé de saisie tactile" hidden></div>

<div class="transport">
    <button type="button" id="btn-jouer" class="btn-transport jouer" title="Lecture / Pause (Espace)" aria-label="Lecture"></button>
    <button type="button" id="btn-stop" class="btn-transport arret" title="Arrêter (Échap)" aria-label="Arrêter"></button>
    <span class="separateur"></span>
    <label class="info-transport" for="champ-tempo">Tempo</label>
    <input type="number" id="champ-tempo" class="champ" min="20" max="400" step="1" value="120" aria-label="Tempo en battements par minute">
    <span class="info-transport">BPM</span>
    <!-- TAP TEMPO — comme HarmoHub : cliquer plusieurs fois au rythme voulu règle le tempo sans
         connaître ni taper une valeur précise. Retour utilisateur : le simple champ numérique
         « n'est pas très clair » — ce bouton donne une SECONDE façon, plus physique, de le régler,
         et par la même occasion signale que ce coin de la barre est bien interactif. -->
    <button type="button" id="btn-tap-tempo" class="btn-transport-texte" title="Tap tempo : cliquer plusieurs fois au rythme voulu pour régler le tempo">TAP</button>
    <span class="separateur"></span>
    <span class="info-transport" id="info-position">Mesure <strong>1</strong> / <strong>4</strong></span>
    <span class="pousse"></span>
    <span class="info-transport" id="info-selection"></span>
    <span class="separateur"></span>
    <!-- MISE EN AVANT : un réglage déjà là, mais discret au point de passer pour absent (retour
         utilisateur : « je peux voir uniquement une mesure en horizontal » sur téléphone — c'est
         justement ce champ, en « Auto », qui décidait de n'en montrer qu'une). Un rang de boutons,
         pas un menu déroulant cliqué à l'aveugle : chaque valeur se voit et se choisit d'un seul
         geste, comme la palette au-dessus. Voir main.js#construireBoutonsMesuresLigne. -->
    <div class="groupe-mesures-ligne" id="groupe-mesures-ligne" role="group" aria-label="Nombre de mesures par ligne"></div>
    <span class="separateur"></span>
    <!-- Métronome — repris de HarmoHub : deux boutons, l'icône du second reflétant son propre état
         (noire seule = clic sur le temps seulement, deux croches reliées = clic de subdivision en
         plus), voir main.js#rafraichirMetronome. Binaire/ternaire suit la signature en vigueur
         (voir uniteDeGroupement) : aucun réglage à faire, une mesure à 6/8 clique par 3, une à 4/4
         par 2 — comme un vrai métronome qui suivrait la partition. -->
    <button type="button" id="btn-metronome-subdivision" class="btn-icone" title="Ajouter un clic sur la subdivision (croche)" aria-label="Ajouter un clic sur la subdivision" aria-pressed="false">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="9" cy="18" rx="4" ry="3" fill="currentColor"/>
            <path d="M13 18V4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
    </button>
    <button type="button" id="btn-metronome" class="btn-icone" title="Garder le métronome pendant la lecture" aria-label="Garder le métronome pendant la lecture" aria-pressed="false">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 20h10L14 5h-4L7 20Z"/>
            <path d="M12 15V8"/>
            <circle cx="12" cy="6" r="1" fill="currentColor" stroke="none"/>
        </svg>
    </button>
</div>

<div class="voile" id="fenetre-reglages" hidden>
    <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="titre-reglages">
        <div class="fenetre-tete">
            <h2 id="titre-reglages">Réglages</h2>
            <span class="pousse"></span>
            <button type="button" class="btn-icone" data-fermer aria-label="Fermer"></button>
        </div>
        <div class="fenetre-corps">
            <div class="rubrique">
                <h3>Instrument</h3>
                <div class="ligne-champ">
                    <label for="champ-instrument">Instrument</label>
                    <select id="champ-instrument" class="champ"></select>
                </div>
                <div class="ligne-champ">
                    <label for="champ-accordage">Accordage</label>
                    <select id="champ-accordage" class="champ"></select>
                </div>
                <!-- REPLIÉES PAR DÉFAUT : capodastre et réglage corde par corde ne servent que dans
                     des cas précis (retour utilisateur) — les sortir de la vue courante évite d'y
                     réfléchir à chaque ouverture, sans les rendre plus difficiles à atteindre qu'un
                     clic. Un <details> natif : aucun état à mémoriser, toujours refermé à l'ouverture
                     suivante des Réglages. -->
                <details class="repli-avance">
                    <summary>Options avancées</summary>
                    <div class="repli-avance-corps">
                        <div class="ligne-champ">
                            <label for="champ-capo">Capodastre</label>
                            <select id="champ-capo" class="champ"></select>
                        </div>
                        <!-- Les cordes s'affichent du GRAVE à l'AIGU, l'ordre dans lequel un
                             instrumentiste énonce son accordage — l'inverse de l'ordre interne (voir
                             model/instruments.js). -->
                        <div class="grille-cordes" id="grille-cordes"></div>
                    </div>
                </details>
            </div>
            <div class="rubrique">
                <h3>Morceau</h3>
                <div class="ligne-champ">
                    <label for="champ-sous-titre">Sous-titre</label>
                    <input type="text" id="champ-sous-titre" class="champ" placeholder="ex. www.exemple.com">
                </div>
                <div class="ligne-champ">
                    <label for="champ-artiste">Artiste</label>
                    <input type="text" id="champ-artiste" class="champ" placeholder="ex. Fernando Sor">
                </div>
            </div>
            <div class="rubrique">
                <h3>Son</h3>
                <div class="ligne-curseur">
                    <div class="ligne-curseur-tete">
                        <label for="champ-volume-general">Volume général</label>
                        <span class="valeur" id="valeur-volume-general">100</span>
                    </div>
                    <input type="range" id="champ-volume-general" min="0" max="100" value="100">
                </div>
                <div class="ligne-curseur">
                    <div class="ligne-curseur-tete">
                        <label for="champ-volume-metronome">Volume du métronome</label>
                        <span class="valeur" id="valeur-volume-metronome">80</span>
                    </div>
                    <input type="range" id="champ-volume-metronome" min="0" max="100" value="80">
                </div>
            </div>
            <div class="rubrique">
                <h3>Interface</h3>
                <div class="ligne-champ">
                    <label for="champ-position-outils">Barre d'outils</label>
                    <select id="champ-position-outils" class="champ">
                        <option value="haut">En haut</option>
                        <option value="gauche">À gauche</option>
                    </select>
                </div>
                <!-- PAVÉ TACTILE : masqué d'emblée (`hidden`) — sur ordinateur, ce réglage ne veut
                     rien dire, mieux vaut ne pas le montrer que de laisser deviner à quoi il sert
                     (retour utilisateur : « je ne comprends pas ces paramètres »). remplirReglages()
                     ne le démasque QUE sur un appareil tactile, seul contexte où la question se pose
                     — et alors un simple interrupteur, plus jamais un choix à trois branches. -->
                <div class="ligne-champ" id="ligne-pave" hidden>
                    <label for="champ-pave">Pavé de saisie tactile</label>
                    <button type="button" id="champ-pave" class="interrupteur" role="switch" aria-checked="true">
                        <span class="interrupteur-curseur"></span>
                    </button>
                </div>
            </div>
            <div class="rubrique">
                <h3>Fichiers</h3>
                <p class="texte-discret" id="etat-brouillon"></p>
                <button type="button" class="btn-neutre" id="btn-vider-brouillon">Vider le brouillon local</button>
            </div>
        </div>
        <div class="fenetre-pied">
            <button type="button" class="btn-plein" data-fermer>Terminé</button>
        </div>
    </div>
</div>

<div class="voile" id="fenetre-aide" hidden>
    <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="titre-aide">
        <div class="fenetre-tete">
            <h2 id="titre-aide">Raccourcis clavier</h2>
            <span class="pousse"></span>
            <button type="button" class="btn-icone" data-fermer aria-label="Fermer"></button>
        </div>
        <div class="fenetre-corps"><table class="table-raccourcis" id="table-raccourcis"></table></div>
        <div class="fenetre-pied"><button type="button" class="btn-plein" data-fermer>Fermer</button></div>
    </div>
</div>

<input type="file" id="entree-fichier" accept="application/json,.json" hidden>
<input type="file" id="entree-fichier-midi" accept="audio/midi,audio/x-midi,.mid,.midi" hidden>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="menu-contextuel" id="menu-contextuel" role="menu" hidden></div>

<script type="module" src="src/main.js?v=202608280300"></script>
</body>
</html>
